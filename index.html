    <script>
        // Lightweight error reporting to the fallback UI (runs even if main app fails)
        window.addEventListener('error', function (e) {
            try {
                var box = document.getElementById('errorBox');
                var fb = document.getElementById('fallback');
                if (box) {
                    box.textContent = 'Error: ' + (e && e.message) + '\n at ' + (e && e.filename) + ':' + (e && e.lineno);
                    box.classList.remove('hidden');
                    if (fb) fb.style.display = 'block';
                }
            } catch (err) {
                console.error('Fallback error handler failed', err);
            }
        });

        window.addEventListener('unhandledrejection', function (e) {
            try {
                var box = document.getElementById('errorBox');
                var fb = document.getElementById('fallback');
                if (box) {
                    var reason = (e && e.reason && e.reason.message) || e.reason || 'Unknown';
                    box.textContent = 'Unhandled Promise Rejection: ' + reason;
                    box.classList.remove('hidden');
                    if (fb) fb.style.display = 'block';
                }
            } catch (err) {
                console.error('Fallback rejection handler failed', err);
            }
        });

        document.getElementById('reloadBtn')?.addEventListener('click', function (ev) {
            ev.preventDefault();
            location.reload();
        });
    </script>

        // 2. Music Player Component
        const MusicPlayer = () => {
            const [currentSongIndex, setCurrentSongIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.7);
            const [repeatMode, setRepeatMode] = useState('sequential'); // 'repeat-one', 'sequential', 'shuffle'
            const [shuffledIndices, setShuffledIndices] = useState([]);
            const audioRef = useRef(null);

            // Initialize shuffled indices
            useEffect(() => {
                const indices = Array.from({ length: PLAYLIST.length }, (_, i) => i);
                setShuffledIndices(shuffleArray(indices));
            }, []);

            const shuffleArray = (array) => {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            };

            const currentSong = PLAYLIST[currentSongIndex];

            const play = () => {
                if (audioRef.current) {
                    audioRef.current.play();
                    setIsPlaying(true);
                }
            };

            const pause = () => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                }
            };

            const togglePlayPause = () => {
                if (isPlaying) {
                    pause();
                } else {
                    play();
                }
            };

            const nextSong = () => {
                let nextIndex;
                if (repeatMode === 'shuffle') {
                    const currentShuffleIndex = shuffledIndices.indexOf(currentSongIndex);
                    nextIndex = shuffledIndices[(currentShuffleIndex + 1) % shuffledIndices.length];
                } else {
                    nextIndex = (currentSongIndex + 1) % PLAYLIST.length;
                }
                setCurrentSongIndex(nextIndex);
                setCurrentTime(0);
                
                // Auto-play next song
                setTimeout(() => {
                    if (audioRef.current) {
                        audioRef.current.play().then(() => {
                            setIsPlaying(true);
                        }).catch((error) => {
                            console.log('Auto-play failed:', error);
                            setIsPlaying(false);
                        });
                    }
                }, 50);
            };

            const prevSong = () => {
                let prevIndex;
                if (repeatMode === 'shuffle') {
                    const currentShuffleIndex = shuffledIndices.indexOf(currentSongIndex);
                    prevIndex = shuffledIndices[currentShuffleIndex === 0 ? shuffledIndices.length - 1 : currentShuffleIndex - 1];
                } else {
                    prevIndex = currentSongIndex === 0 ? PLAYLIST.length - 1 : currentSongIndex - 1;
                }
                setCurrentSongIndex(prevIndex);
                setCurrentTime(0);
            };

            const handleTimeUpdate = () => {
                if (audioRef.current) {
                    setCurrentTime(audioRef.current.currentTime);
                    setDuration(audioRef.current.duration);
                }
            };

            const handleSeek = (e) => {
                const newTime = (e.target.value / 100) * duration;
                if (audioRef.current) {
                    audioRef.current.currentTime = newTime;
                    setCurrentTime(newTime);
                }
            };

            const handleVolumeChange = (e) => {
                const newVolume = e.target.value / 100;
                setVolume(newVolume);
                if (audioRef.current) {
                    audioRef.current.volume = newVolume;
                }
            };

            const toggleRepeatMode = () => {
                const modes = ['sequential', 'repeat-one', 'shuffle'];
                const currentIndex = modes.indexOf(repeatMode);
                const nextMode = modes[(currentIndex + 1) % modes.length];
                setRepeatMode(nextMode);
                if (nextMode === 'shuffle') {
                    const indices = Array.from({ length: PLAYLIST.length }, (_, i) => i);
                    setShuffledIndices(shuffleArray(indices));
                }
            };

            const handleSongEnd = () => {
                if (repeatMode === 'repeat-one') {
                    if (audioRef.current) {
                        audioRef.current.currentTime = 0;
                        audioRef.current.play();
                    }
                } else {
                    // For sequential and shuffle, keep playing state and go to next song
                    nextSong();
                }
            };

            const formatTime = (time) => {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                return `${minutes}:${seconds.toString().padStart(2, '0')}`;

            const downloadCurrentSong = () => {

            return (
                <div className="glass-card p-6 rounded-2xl hover:shadow-xl transition-shadow">

                            🎵
                        </div>

                        <p className="text-sm text-slate-500">Musik favorit kelas Source Speed</p>
                    </div>

                    <div className="space-y-4">
                        {/* Current Song Info */}
                        <div className="text-center bg-gradient-to-r from-blue-50 to-cyan-50 p-4 rounded-lg">
                            <h4 className="font-semibold text-lg text-slate-900 truncate">{currentSong.title}</h4>
                            <p className="text-sm text-slate-500">Lagu {currentSongIndex + 1} dari {PLAYLIST.length}</p>
                        </div>

                        {/* Progress Bar */}
                        <div className="space-y-2">
                            <input
                                type="range"
                                min="0"
                                max="100"
                                value={duration ? (currentTime / duration) * 100 : 0}
                                onChange={handleSeek}
                                className="w-full h-2 bg-gradient-to-r from-blue-200 to-cyan-200 rounded-lg appearance-none cursor-pointer slider hover:h-3 transition-all"
                            />
                            <div className="flex justify-between text-xs text-slate-500">
                                <span className="font-medium">{formatTime(currentTime)}</span>
                                <span className="font-medium">{formatTime(duration)}</span>
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="flex items-center justify-center gap-4">
                            <button onClick={prevSong} className="p-2 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 hover:scale-110 transition-all">
                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M8.445 14.832A1 1 0 0010 14v-2.798l5.445 3.63A1 1 0 0017 14V6a1 1 0 00-1.555-.832L10 8.798V6a1 1 0 00-1.555-.832l-6 4a1 1 0 000 1.664l6 4z"/>
                                </svg>
                            </button>

                            <button onClick={togglePlayPause} className="p-3 rounded-full bg-gradient-to-r from-blue-600 to-blue-700 text-white hover:from-blue-700 hover:to-blue-800 hover:scale-110 transition-all shadow-lg hover:shadow-xl">
                                {isPlaying ? (
                                    <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd"/>
                                    </svg>
                                ) : (
                                    <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"/>
                                    </svg>
                                )}
                            </button>

                            <button onClick={nextSong} className="p-2 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 hover:scale-110 transition-all">
                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M4.555 5.168A1 1 0 003 6v8a1 1 0 001.555.832L10 11.202V14a1 1 0 001.555.832l6-4a1 1 0 000-1.664l-6-4A1 1 0 0010 6v2.798l-5.445-3.63z"/>
                                </svg>
                            </button>
                        </div>

                        {/* Volume and Repeat Controls */}
                        <div className="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
                            <div className="flex items-center gap-2">
                                <svg className="w-4 h-4 text-slate-500" fill="currentColor" viewBox="0 0 20 20">
                                    <path fillRule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.617.816L4.414 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.414l3.969-3.816a1 1 0 011.234 0zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clipRule="evenodd"/>
                                </svg>
                                <input
                                    type="range"
                                    min="0"
                                    max="100"
                                    value={volume * 100}
                                    onChange={handleVolumeChange}
                                    className="w-20 h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer slider"

                            <div className="flex items-center gap-2">
                                <button onClick={toggleRepeatMode} className="p-2 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 transition-all" title={`Repeat: ${repeatMode}`}>
                                    {repeatMode === 'sequential' && <span className="text-lg">🔄</span>}
                                    {repeatMode === 'repeat-one' && <span className="text-lg">🔂</span>}
                                    {repeatMode === 'shuffle' && <span className="text-lg">🔀</span>}
                                </button>
                                <button onClick={downloadCurrentSong} className="p-2 rounded-full bg-green-500 text-white hover:bg-green-600 transition-all hover:scale-110" title="Download">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    {/* Hidden Audio Element */}
                    <audio
                        ref={audioRef}

                        onTimeUpdate={handleTimeUpdate}
                        onLoadedMetadata={() => setDuration(audioRef.current.duration)}
                        onEnded={handleSongEnd}

        // 3. Main App Component
        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [currentImageIndex, setCurrentImageIndex] = useState(0);
            const [activeSection, setActiveSection] = useState('home');
            const [sectionAnimations, setSectionAnimations] = useState({
                home: false,
                profile: false,
                structure: false,
                gallery: false,
                contact: false
            });
            const [currentGalleryIndex, setCurrentGalleryIndex] = useState(0);
            const [isGalleryAutoPlaying, setIsGalleryAutoPlaying] = useState(true);
            const [snowflakes, setSnowflakes] = useState([]);
            const [showLightning, setShowLightning] = useState(false);

            // Cursor-following Snowflake and Lightning Effect
            useEffect(() => {
                const handleMouseMove = (e) => {
                    const newSnowflake = {
                        id: Math.random(),
                        x: e.clientX,
                        y: e.clientY,
                        size: 0.8 + Math.random() * 0.4,
                        timestamp: Date.now()
                    };
                    setSnowflakes(prev => [...prev, newSnowflake]);
                };

                const handleTouchMove = (e) => {
                    if (e.touches && e.touches.length > 0) {
                        const touch = e.touches[0];
                        const newSnowflake = {
                            id: Math.random(),
                            x: touch.clientX,
                            y: touch.clientY,
                            size: 0.8 + Math.random() * 0.4,
                            timestamp: Date.now()
                        };
                        setSnowflakes(prev => [...prev, newSnowflake]);
                    }
                };

                // Lightning effect every 15 seconds
                const lightningInterval = setInterval(() => {
                    setShowLightning(true);
                    setTimeout(() => setShowLightning(false), 600);
                }, 15000);

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('touchmove', handleTouchMove);

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('touchmove', handleTouchMove);
                    clearInterval(lightningInterval);
                };
            }, []);

            // Clean up old snowflakes
            useEffect(() => {
                const cleanupInterval = setInterval(() => {
                    setSnowflakes(prev => 
                        prev.filter(snowflake => Date.now() - snowflake.timestamp < 1000)
                    );
                }, 100);

                return () => clearInterval(cleanupInterval);
            }, []);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Intersection Observer for section animations
            useEffect(() => {
                const observerOptions = {
                    threshold: 0.3,
                    rootMargin: '-50px 0px -50px 0px'
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            const sectionId = entry.target.id;
                            setActiveSection(sectionId);
                            setSectionAnimations(prev => ({
                                ...prev,
                                [sectionId]: true
                            }));
                        }
                    });
                }, observerOptions);

                // Observe all sections
                const sections = ['home', 'profile', 'structure', 'gallery', 'contact'];
                sections.forEach(section => {
                    const element = document.getElementById(section);
                    if (element) observer.observe(element);
                });

                return () => observer.disconnect();
            }, []);

            // Auto-slide gallery
            useEffect(() => {
                if (!isGalleryAutoPlaying) return;

                const interval = setInterval(() => {
                    setCurrentGalleryIndex((prev) => (prev + 1) % GALLERY.length);
                }, 5000); // 5 seconds

                return () => clearInterval(interval);
            }, [isGalleryAutoPlaying]);

            const scrollTo = (id) => {
                setMobileMenuOpen(false);
                document.getElementById(id)?.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start',
                    inline: 'nearest'
                });
            };

            const openModal = (index) => {
                setCurrentImageIndex(index);
                setIsModalOpen(true);
            };

            const closeModal = () => setIsModalOpen(false);

            const nextGallery = () => {
                setCurrentGalleryIndex((prev) => (prev + 1) % GALLERY.length);
                setIsGalleryAutoPlaying(false); // Pause auto-play when manually controlled
                setTimeout(() => setIsGalleryAutoPlaying(true), 10000); // Resume after 10 seconds
            };

            const prevGallery = () => {
                setCurrentGalleryIndex((prev) => (prev - 1 + GALLERY.length) % GALLERY.length);
                setIsGalleryAutoPlaying(false);
                setTimeout(() => setIsGalleryAutoPlaying(true), 10000);
            };

            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            // Minimum swipe distance (in px)
            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);

    <script type="module">
        // Module bootstrapper:
        // - reads the JSX script above
        // - strips top-level import lines
        // - transpiles JSX to plain JS using Babel standalone
        // - creates a dynamic module that imports React and lucide icons from ESM CDN
        // - executes the module so the original app runs unmodified
        (async function() {
            try {
                const raw = document.getElementById('app-jsx').textContent || '';

                // Remove any existing import lines (if author left them)
                const cleaned = raw.replace(/^\s*import .*$/mg, '');

                // Transpile JSX -> JS (classic runtime)
                const transformed = Babel.transform(cleaned, {
                    presets: ['react', 'env'],
                    sourceType: 'script'
                }).code;

                // Compose a module that provides React and lucide icons as imports
                const moduleSource = `
import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
import * as lucide from 'https://esm.sh/lucide-react@0.330.0';
const { Zap, Menu, X, Instagram, Github, Mail, Trophy, Users, Image: ImageIcon, Hash, Sparkles, MonitorPlay, ChevronLeft, ChevronRight, Music } = lucide;
${transformed}
`;

                const blob = new Blob([moduleSource], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);

                await import(url);
            } catch (err) {
                console.error('App bootstrap failed:', err);
                // Show error in fallback UI if present
                const box = document.getElementById('errorBox');
                const fb = document.getElementById('fallback');
                if (box) {
                    box.textContent = (err && err.stack) ? err.stack : String(err);
                    box.classList.remove('hidden');
                }
                if (fb) fb.style.display = 'block';
            }
        })();
    </script>
